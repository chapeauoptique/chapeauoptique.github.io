<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boutique et Compendium · Chapeau Optique</title>
<meta name="description" content="La boutique de Chapeau Optique : avatars et badges à gagner avec les Gils.">
<meta name="theme-color" content="#d8d2bd">
<script>/* thème mémorisé, appliqué avant l'affichage (clair par défaut) */
try{ if(localStorage.getItem("theme") === "sombre") document.documentElement.dataset.theme = "sombre"; }catch{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Share+Tech+Mono&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ===== Palette NieR : crème / sépia, encre brune, ocre pour l'actif ===== */
:root{
  --creme:#d8d2bd; --creme2:#cdc6ae; --papier:#e6e1ce; --encre:#4a4636; --encre2:#5c5744;
  --ocre:#e6c35c; --ocre2:#c9a640; --quad:rgba(74,70,54,.07); --ligne:rgba(74,70,54,.3);
  --bon:#4f6b3a; --mauvais:#8e4433;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif; --corps:"Barlow",system-ui,sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Consolas,monospace; --pixel:"Press Start 2P",monospace;
  --barre-bas:0px;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}   /* piège connu : un display:grid/block d'auteur écrasait [hidden] */
html{scroll-behavior:smooth;scroll-padding-top:4.5rem;-webkit-text-size-adjust:100%}
body{margin:0;min-width:0;overflow-x:hidden;color:var(--encre);font:1.02rem/1.55 var(--corps);
  background-color:var(--creme);
  background-image:linear-gradient(var(--quad) 1px,transparent 1px),linear-gradient(90deg,var(--quad) 1px,transparent 1px);
  background-size:7px 7px;padding-bottom:var(--barre-bas)}
a{color:var(--encre);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--encre);outline-offset:2px;box-shadow:0 0 0 4px var(--ocre)}
.wrap{width:min(80rem,100% - 2rem);margin-inline:auto}
.visuel-masque{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pointilles{height:6px;margin:1.2rem 0;opacity:.55;
  background:radial-gradient(circle,var(--encre) 1.3px,transparent 1.8px) 0 0/11px 6px repeat-x}

/* ===== En-tête : logo centré, camion à droite ===== */
.haut{position:relative;z-index:20;overflow:hidden;border-bottom:1px solid var(--encre);
  padding-top:env(safe-area-inset-top,0px);background:rgba(205,198,174,.6)}
.haut>img.fond{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;
  filter:sepia(.8) saturate(.6) contrast(.9);mix-blend-mode:multiply;pointer-events:none}
.haut .elfe{position:absolute;left:-1.5rem;bottom:-1.5rem;height:125%;width:auto;opacity:.16;
  filter:sepia(1) saturate(.4);mix-blend-mode:multiply;pointer-events:none;
  -webkit-mask-image:linear-gradient(270deg,transparent,#000 60%);mask-image:linear-gradient(270deg,transparent,#000 60%)}
.haut-grille{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;padding-block:.8rem .4rem}
.badge{justify-self:start;display:flex;align-items:center;gap:.55rem;min-width:0;padding:.3rem .6rem .3rem .3rem;
  background:var(--papier);border:1px solid var(--encre);cursor:pointer;font:600 .95rem var(--cond);letter-spacing:.06em;text-transform:uppercase}
.badge:hover{background:var(--encre);color:var(--creme)}
.avatar{flex:none;display:grid;place-items:center;width:2rem;height:2rem;background:var(--encre);color:var(--ocre);
  font:700 1.05rem var(--cond);text-transform:uppercase}
.badge:hover .avatar{background:var(--ocre);color:var(--encre)}
.badge-nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9rem}
.logo{display:flex;align-items:center;gap:.9rem;text-decoration:none;color:var(--encre)}
.profil{flex:none;width:clamp(3.4rem,9vw,5rem);aspect-ratio:1;border-radius:50%;border:2px solid var(--encre);
  box-shadow:0 0 0 4px var(--creme),0 0 0 5px var(--encre)}
.logo h1{margin:0;font:700 clamp(1.5rem,4.2vw,2.6rem)/1 var(--cond);letter-spacing:.18em;text-transform:uppercase}
.logo h1 small{display:block;margin-bottom:.25rem;font:400 .8rem var(--mono);letter-spacing:.3em;color:var(--encre2)}
.accroche{position:relative;margin:0;padding:.1rem 1rem .7rem;text-align:center;font:italic 1rem var(--corps);color:var(--encre2)}

/* ===== Camion : « Soutenir la chaîne » posé sur la portière (conservé) ===== */
.camion{--w:clamp(10.5rem,38vw,14rem);justify-self:end;position:relative;flex:none;width:var(--w);aspect-ratio:541/297}
.camion-img{width:100%;height:100%;pointer-events:none;user-select:none}
.soutien{position:absolute;left:14%;top:56%;width:38%;height:25%}
.soutien summary{list-style:none;cursor:pointer;height:100%;display:flex;align-items:center;justify-content:center;gap:3%;
  padding:0 2%;font:600 calc(var(--w) * .05)/1.05 var(--cond);letter-spacing:.03em;text-align:left;color:var(--creme);
  background:rgba(74,70,54,.92);border:1px solid var(--ocre);transition:background .2s,color .2s}
.soutien summary:hover,.soutien[open] summary{background:var(--ocre);color:var(--encre)}
.coeur{flex:none;width:calc(var(--w) * .075);height:calc(var(--w) * .075);image-rendering:pixelated}
.soutien summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + .35rem);z-index:30;font-size:1rem;width:15.5rem;max-width:calc(100vw - 1rem);padding:.4rem;
  background:var(--papier);border:1px solid var(--encre);box-shadow:4px 4px 0 rgba(74,70,54,.25)}
.menu a{display:block;padding:.6rem .75rem;color:var(--encre);text-decoration:none;font-weight:600}
.menu a:hover,.menu a:focus-visible{background:var(--encre);color:var(--creme)}
.menu small{display:block;font-weight:400;opacity:.8;font-size:.85rem}

/* ===== Barre d'onglets (bureau) ===== */
.nav-onglets{position:sticky;top:0;z-index:15;background:rgba(216,210,189,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--encre)}
.nav-onglets>ul{display:flex;gap:.4rem;margin-block:0;padding:.5rem 0;list-style:none}
.nav-onglets li{position:relative}
.nav-onglets a,.nav-onglets button{display:flex;align-items:center;gap:.4rem;padding:.38rem 1.2rem;border:1px solid var(--encre);
  background:var(--creme2);color:var(--encre);font:600 1.02rem var(--cond);letter-spacing:.16em;text-transform:uppercase;
  text-decoration:none;cursor:pointer}
.nav-onglets a::before,.nav-onglets button::before{content:"";width:.5rem;height:.5rem;background:var(--encre);opacity:.35}
.nav-onglets a:hover,.nav-onglets button:hover{background:var(--encre);color:var(--creme)}
.nav-onglets [aria-current="true"],.nav-onglets button[aria-expanded="true"]{background:var(--ocre);color:var(--encre)}
.nav-onglets [aria-current="true"]::before{opacity:1}
.sous-menu{position:absolute;left:0;top:calc(100% + .3rem);z-index:20;min-width:13rem;margin:0;padding:.3rem;list-style:none;
  background:var(--papier);border:1px solid var(--encre);box-shadow:4px 4px 0 rgba(74,70,54,.25)}
.nav-onglets .sous-menu a{border:0;background:none;padding:.45rem .7rem;letter-spacing:.1em}
.nav-onglets .sous-menu a:hover,.nav-onglets .sous-menu a:focus-visible{background:var(--encre);color:var(--creme)}

/* ===== Grille principale ===== */
.page{display:grid;grid-template-columns:minmax(0,1fr) 23.5rem;gap:1.6rem;align-items:start;padding-block:1.4rem 0}
.col-main,.col-side{display:grid;gap:1.6rem;min-width:0}
.duo{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:1.6rem;align-items:stretch}

/* ===== Cadres « chip » : crans de puce au-dessus, coins carrés ===== */
.chip{position:relative;min-width:0;margin-top:10px;background:rgba(230,225,206,.82);border:1px solid var(--encre);
  box-shadow:4px 4px 0 rgba(74,70,54,.16);display:flex;flex-direction:column}
.chip::before{content:"";position:absolute;left:12px;top:-10px;width:70px;height:6px;
  background:repeating-linear-gradient(90deg,var(--encre) 0 6px,transparent 6px 11px)}
.chip::after{content:"";position:absolute;right:12px;top:-10px;width:28px;height:6px;
  background:repeating-linear-gradient(90deg,var(--encre) 0 6px,transparent 6px 11px);opacity:.5}
.chip>h2{margin:0}
.chip-btn{display:flex;align-items:center;gap:.7rem;width:100%;padding:.5rem .9rem;border:0;background:var(--encre);color:var(--creme);
  font:600 1.15rem var(--cond);letter-spacing:.14em;text-transform:uppercase;text-align:left;cursor:default}
.puce{flex:none;padding:0 .4rem;background:var(--creme);color:var(--encre);font:400 .72rem/1.5 var(--mono);letter-spacing:.12em}
.chip-titre{flex:1;min-width:0}
.chip-fleche{display:none;flex:none;width:.6rem;height:.6rem;border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.chip-btn[aria-expanded="false"] .chip-fleche{transform:rotate(-45deg)}
.chip-corps{padding:1rem;min-width:0;flex:1;display:flex;flex-direction:column}
.chip-pied{margin:.6rem 0 0;font:400 .9rem var(--mono)}

/* ===== Carrousels (vidéos et VOD, conservés) ===== */
.carrousel{position:relative}
.piste{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.25rem .25rem 1rem;counter-reset:puce;
  scrollbar-width:thin;scrollbar-color:var(--encre) transparent}
.carte{position:relative;flex:0 0 min(80%,17rem);scroll-snap-align:start;background:var(--papier);border:1px solid var(--encre);
  color:var(--encre);text-decoration:none;counter-increment:puce;transition:transform .2s,background .2s}
.carte::before{content:var(--etiquette,"VIDÉO") " " counter(puce,decimal-leading-zero);display:block;padding:.15rem .5rem;
  border-bottom:1px solid var(--encre);font:400 .72rem var(--mono);letter-spacing:.14em}
.carte:hover,.carte:focus-visible{transform:translateY(-3px);background:var(--ocre)}
.carte img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--creme2);filter:sepia(.15)}
.carte span{display:block;padding:.6rem .7rem .8rem;font:500 .98rem/1.3 var(--corps)}
.fleche{position:absolute;top:38%;z-index:2;width:2.4rem;height:2.4rem;border:1px solid var(--encre);
  background:var(--papier);color:var(--encre);font-size:1.3rem;line-height:1;cursor:pointer}
.fleche:hover{background:var(--encre);color:var(--creme)}
.fleche.g{left:-.5rem}.fleche.d{right:-.5rem}
@media(hover:none){.fleche{display:none}}
.statut{padding:.6rem;opacity:.85}
[data-source="vod"]{--etiquette:"VOD"}

/* ===== Live Twitch (conservé) ===== */
.live{position:relative;aspect-ratio:16/9;background:var(--encre);border:1px solid var(--encre);overflow:hidden}
#lecteur,#lecteur iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.live:not(.en-ligne) #lecteur{visibility:hidden}
.hors{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:.6rem;text-align:center;background:var(--encre)}
.hors img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.7) brightness(.45)}
.hors p,.hors a{position:relative;margin:0}
.hors p{font:600 1.3rem var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--creme)}
.live.en-ligne .hors{display:none}
#lecteur>.lecteur-chaine{position:absolute;inset:0}
#lecteur>.lecteur-chaine.cache{visibility:hidden;pointer-events:none}
.chaines{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .6rem}
.chaine{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .8rem;border:1px solid var(--encre);background:var(--papier);
  font:400 .85rem var(--mono);letter-spacing:.06em;cursor:pointer}
.chaine::before{content:"";width:.45rem;height:.45rem;background:var(--encre);opacity:.3}
.chaine:hover{background:var(--encre);color:var(--creme)}
.chaine[aria-pressed="true"]{background:var(--ocre);color:var(--encre)}
.chaine[aria-pressed="true"]::before{opacity:1}
.chaine .direct{padding:0 .3rem;background:var(--mauvais);color:#fff;font:600 .68rem/1.5 var(--cond);letter-spacing:.1em}
.barre{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;
  margin-top:.9rem;padding:.8rem 5.5rem .8rem 1rem;min-height:5rem;border:1px dashed var(--encre);background:var(--creme2)}
.barre p{margin:0;max-width:30rem}
.barre img{position:absolute;right:.9rem;top:50%;width:3.8rem;height:3.8rem;transform:translateY(-50%);pointer-events:none}
.bouton{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem 1.1rem;border:1px solid var(--encre);
  background:var(--encre);color:var(--creme);font:600 1rem var(--cond);letter-spacing:.12em;text-transform:uppercase;
  text-decoration:none;cursor:pointer;transition:background .15s,color .15s}
.bouton:hover{background:var(--ocre);color:var(--encre)}
.bouton:disabled{opacity:.5;cursor:wait}
.bouton.clair{background:var(--papier);color:var(--encre)}
.bouton.clair:hover{background:var(--encre);color:var(--creme)}

/* ===== VOD : liste verticale défilante à côté du stream (bureau) ===== */
@media(min-width:62rem){
  #vod .chip-corps{position:relative;min-height:18rem}
  #vod .carrousel{position:absolute;inset:1.5rem 1rem 3.3rem}
  #vod .chip-pied{position:absolute;left:1rem;bottom:.8rem;margin:0}
  #vod .piste{flex-direction:column;height:100%;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y proximity;padding:.1rem .5rem .1rem .1rem;gap:.6rem}
  #vod .carte{flex:none;display:grid;grid-template-columns:7.2rem minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start}
  #vod .carte::before{grid-column:1/-1}
  #vod .carte img{border-right:1px solid var(--encre)}
  #vod .carte span{padding:.35rem .55rem;font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #vod .carte:hover{transform:translateX(3px)}
  #vod .fleche{left:50%;right:auto;width:2rem;height:1.6rem;font-size:1.1rem;transform:translateX(-50%) rotate(90deg)}
  #vod .fleche.g{top:-1.35rem}#vod .fleche.d{top:auto;bottom:-1.35rem}
}

/* ===== Formulaires ===== */
form{display:grid;gap:.8rem;max-width:36rem}
label{display:grid;gap:.25rem;font:600 .95rem var(--cond);letter-spacing:.08em;text-transform:uppercase}
input,textarea,select{width:100%;padding:.6rem .7rem;font:1rem var(--corps);color:var(--encre);background:var(--papier);
  border:1px solid var(--encre);border-radius:0}
textarea{min-height:6.5rem;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ocre2);outline-offset:0}
#retour{min-height:1.5rem;margin:0;font-weight:600}

/* ===== Panneau QUIZZ (colonne droite) ===== */
.chip-quizz{border-width:2px}
.qz-joueur{display:flex;align-items:center;gap:.6rem;padding-bottom:.7rem;border-bottom:1px dashed var(--ligne)}
.qz-joueur>div{flex:1;min-width:0;line-height:1.2}
.qz-joueur strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 1.1rem var(--cond);letter-spacing:.08em;text-transform:uppercase}
.qz-joueur small{display:block;font:400 .8rem var(--mono);color:var(--encre2)}
.en-ligne-pt::before{content:"";display:inline-block;width:.5rem;height:.5rem;margin-right:.35rem;background:var(--bon);vertical-align:.05rem}
.mini{padding:.25rem .6rem;border:1px solid var(--encre);background:var(--papier);font:600 .85rem var(--cond);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.mini:hover{background:var(--encre);color:var(--creme)}
.qz-xp{padding:.7rem 0 .2rem}
.qz-invit{display:flex;gap:.5rem;align-items:center;margin:.6rem 0 0;padding:.45rem .6rem;border:1px dashed var(--encre);background:rgba(230,195,92,.18);color:inherit;text-decoration:none;font-size:.88rem;line-height:1.3}
.qz-invit[hidden]{display:none!important}
.st-haut{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center;margin:.4rem 0}
.st-tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.5rem;margin:.4rem 0 .8rem}
.st-tuile{display:flex;flex-direction:column;gap:.15rem;padding:.5rem .6rem;border:1px solid var(--encre);background:rgba(74,70,54,.05)}
.st-tuile b{font-size:1.25rem}
.st-tuile small{font-size:.72rem;opacity:.8}
.st-graph{margin:.3rem 0 .9rem}
.st-graph figcaption{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3rem}
.st-barres{display:flex;align-items:flex-end;gap:2px;height:110px;padding:4px;border:1px solid var(--encre);background:repeating-linear-gradient(0deg,transparent 0 21px,rgba(74,70,54,.12) 21px 22px)}
.st-barres span{flex:1 1 0;min-width:2px;background:var(--encre);opacity:.85}
.st-barres span:hover{background:var(--ocre);opacity:1}
.st-axe{display:flex;justify-content:space-between;font-size:.7rem;opacity:.8}
.st-table{overflow-x:auto;max-width:100%}
.qz-invit:hover,.qz-invit:focus-visible{background:rgba(230,195,92,.32)}
.qz-xp-txt{display:flex;justify-content:space-between;gap:.5rem;font:400 .8rem var(--mono)}
.qz-xp-barre{height:.7rem;margin-top:.3rem;border:1px solid var(--encre);background:var(--creme2);padding:1px}
.qz-xp-barre>i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--encre) 0 6px,transparent 6px 8px);transition:width .6s}
.qz-icones{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin:.8rem 0}
.qz-ico{display:grid;justify-items:center;gap:.2rem;padding:.55rem .2rem .4rem;border:1px solid var(--encre);background:var(--papier);
  font:600 .78rem var(--cond);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.qz-ico svg{width:1.35rem;height:1.35rem}
.qz-ico:hover,.qz-ico[aria-pressed="true"]{background:var(--encre);color:var(--creme)}
.qz-sous{margin:.4rem 0 .45rem;font:600 .78rem var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--encre2)}
.quizz-cartes{display:grid;gap:.45rem}
.quizz-carte{position:relative;display:grid;grid-template-columns:4.6rem minmax(0,1fr);align-items:center;gap:.7rem;width:100%;padding:.3rem;margin:0;
  border:1px solid var(--encre);background:var(--papier);color:var(--encre);font:inherit;text-align:left;cursor:pointer;transition:background .15s}
.quizz-carte[hidden]{display:none!important}
button.quizz-carte:hover,button.quizz-carte:focus-visible,button.quizz-carte.choisi{background:var(--ocre)}
button.quizz-carte.choisi::after{content:"";position:absolute;right:.6rem;top:50%;width:.55rem;height:.55rem;background:var(--encre);transform:translateY(-50%)}
.quizz-carte img{width:100%;aspect-ratio:2/1;object-fit:cover;border:1px solid var(--encre);filter:sepia(.25)}
.quizz-carte span{display:block;font:700 1rem/1.15 var(--cond);letter-spacing:.06em;text-transform:uppercase;padding-right:1.2rem}
.quizz-carte span small{display:block;margin-top:.15rem;font:400 .75rem var(--mono);letter-spacing:.04em;text-transform:none;color:var(--encre2)}
div.quizz-carte.griser{cursor:not-allowed;opacity:.5;filter:grayscale(.8);border-style:dashed}
.qz-ecran{margin-top:.9rem;border:1px solid var(--encre);background:var(--creme)}
.qz-ecran-titre{margin:0;padding:.3rem .7rem;border-bottom:1px solid var(--encre);background:var(--creme2);font:600 .95rem var(--cond);letter-spacing:.14em;text-transform:uppercase}
#qzCorps{padding:.8rem .8rem 1rem}
#qzCorps>p:first-child{margin-top:0}
#qzCorps form{max-width:none}
.qz-barre{height:.4rem;border:1px solid var(--encre);background:var(--papier);margin:.2rem 0 .9rem}
.qz-barre>i{display:block;height:100%;width:100%;background:var(--encre);transition:width 1s linear}
.qz-barre.urgent>i{background:var(--mauvais)}
.qz-meta{display:flex;justify-content:space-between;gap:.5rem;font:400 .8rem var(--mono);margin-bottom:.3rem}
.qz-question{font:600 1.08rem/1.4 var(--corps);margin:.1rem 0 .9rem}
.qz-resultat{margin:.6rem 0;padding:.7rem .8rem;border:1px solid var(--encre);border-left-width:6px;background:var(--papier)}
.qz-resultat.bon{border-left-color:var(--bon)}
.qz-resultat.mauvais{border-left-color:var(--mauvais)}
.qz-resultat>strong{display:block;margin-bottom:.2rem;font:700 1rem var(--cond);letter-spacing:.1em;text-transform:uppercase}
.qz-resultat.bon>strong{color:var(--bon)}
.qz-resultat.mauvais>strong{color:var(--mauvais)}
.qz-resultat p{margin:.3rem 0 0;font-size:.95rem}

/* ===== Discord ===== */
.dc-cadre{position:relative;height:30rem;border:1px solid var(--encre);background:var(--encre)}

/* ===== Pied de page : anecdotes + signature 16 bits (conservés) ===== */
footer{margin-top:2rem;padding:0 0 2rem;text-align:center}
.bulle{position:relative;max-width:34rem;margin:0 auto 1.6rem;padding:.9rem 1.1rem;text-align:left;cursor:pointer;
  background:var(--papier);border:1px solid var(--encre);box-shadow:4px 4px 0 rgba(74,70,54,.16)}
.bulle::after{content:"";position:absolute;left:50%;bottom:-.6rem;width:1.1rem;height:1.1rem;background:var(--papier);
  border:solid var(--encre);border-width:0 1px 1px 0;transform:translateX(-50%) rotate(45deg)}
.bulle strong{display:block;margin-bottom:.2rem;font:700 .95rem var(--cond);letter-spacing:.14em;text-transform:uppercase}
.bulle p{margin:0;line-height:1.45}
.bulle small{display:block;margin-top:.4rem;opacity:.75;font-family:var(--mono)}
.trivia{display:flex;align-items:flex-end;justify-content:center;gap:1rem}
.trivia .bulle{flex:1 1 auto;margin:0 0 1.6rem}
.trivia img{flex:none;height:9rem;width:auto;opacity:.3;pointer-events:none;margin-bottom:1.6rem;filter:sepia(1) saturate(.5);mix-blend-mode:multiply;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.pixel{margin:0;font:.8rem/1.6 var(--pixel);color:var(--encre);text-shadow:2px 2px 0 var(--ocre)}
.admin{display:inline-block;margin-top:1rem;padding:.3rem;font:inherit;font-size:.8rem;color:var(--encre2);background:none;border:0;cursor:pointer}

/* ===== Dialog Admin (conservé) ===== */
dialog{width:min(40rem,calc(100% - 1.5rem));max-height:85vh;padding:1.2rem;color:var(--encre);background:var(--papier);
  border:2px solid var(--encre);border-radius:0;box-shadow:6px 6px 0 rgba(74,70,54,.3)}
dialog::backdrop{background:rgba(40,37,28,.6)}
.admin-tete{display:flex;justify-content:space-between;align-items:center;margin:-1.2rem -1.2rem 1rem;padding:.5rem 1rem;
  background:var(--encre);color:var(--creme);font:600 1.1rem var(--cond);letter-spacing:.14em;text-transform:uppercase}
.admin-tete button{width:2.2rem;height:2.2rem;border:0;background:none;color:var(--creme);font-size:1.4rem;cursor:pointer}
.onglets{display:flex;gap:.25rem;margin:0 0 1rem;padding:0;list-style:none;border-bottom:1px solid var(--encre)}
.onglets li{padding:.45rem .8rem;font:600 .98rem var(--cond);letter-spacing:.1em;text-transform:uppercase}
.onglets .off{opacity:.45;cursor:not-allowed}
.onglets .actif{background:var(--ocre)}
.note{margin:.7rem 0;padding:.8rem;background:var(--creme);border:1px solid var(--encre)}
.note small{font-family:var(--mono)}.note p{margin:.4rem 0;white-space:pre-wrap}
.note button{padding:.3rem .7rem;font:inherit;color:var(--encre);background:var(--papier);border:1px solid var(--encre);cursor:pointer}

/* ===== Bouton thème + accès admin (en-tête) ===== */
.haut-gauche{justify-self:start;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;min-width:0}
.theme-btn{padding:.35rem .6rem;border:1px solid var(--encre);background:var(--papier);color:var(--encre);
  font:400 .8rem var(--mono);letter-spacing:.1em;cursor:pointer}
.theme-btn:hover{background:var(--encre);color:var(--creme)}
.btn-admin{padding:.35rem .6rem;border:1px dashed var(--encre);background:var(--ocre);color:#2a2619;font:600 .85rem var(--cond);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.admin{position:absolute;right:.4rem;bottom:.4rem;width:1.1rem;height:1.1rem;padding:0;margin:0;border:0;background:none;color:transparent;opacity:.25;cursor:default}
.admin:focus-visible{color:var(--encre);opacity:1}
footer .wrap{position:relative}

/* ===== Mode sombre : version nuit NieR (le clair reste le défaut) ===== */
:root[data-theme="sombre"]{
  --creme:#1d1a14; --creme2:#29251d; --papier:#2e2920; --encre:#e3dcc4; --encre2:#bdb397;
  --ocre:#e6c35c; --ocre2:#c9a640; --quad:rgba(227,220,196,.045); --ligne:rgba(227,220,196,.28);
  --bon:#a5c98a; --mauvais:#e8957f; color-scheme:dark}
[data-theme="sombre"] .haut{background:rgba(41,37,29,.75)}
[data-theme="sombre"] .nav-onglets{background:rgba(29,26,20,.94)}

[data-theme="sombre"] .haut>img.fond,[data-theme="sombre"] .haut .elfe,[data-theme="sombre"] .trivia img{mix-blend-mode:normal;opacity:.12}
[data-theme="sombre"] .hors p,[data-theme="sombre"] .soutien summary{color:#e3dcc4}
[data-theme="sombre"] .avatar{color:var(--creme);background:var(--encre)}
[data-theme="sombre"] .carte img,[data-theme="sombre"] .quizz-carte img{filter:none}
/* texte toujours foncé sur l'ocre, dans les deux thèmes */
[data-theme="sombre"] :is(.soutien summary:hover,.soutien[open] summary,.nav-onglets [aria-current="true"],.nav-onglets button[aria-expanded="true"],
  .carte:hover,.carte:focus-visible,.chaine[aria-pressed="true"],button.quizz-carte:hover,button.quizz-carte:focus-visible,button.quizz-carte.choisi,
  .qz-onglets-compte button.actif,.bouton:hover,.qz-classement tr.moi td,.onglets .actif,.barre-bas a[aria-current="true"],.badge:hover .avatar){color:#2a2619}
[data-theme="sombre"] button.quizz-carte.choisi span small,[data-theme="sombre"] button.quizz-carte:hover span small{color:#3d3826}
[data-theme="sombre"] button.quizz-carte.choisi::after{background:#2a2619}
[data-theme="sombre"] .pixel{text-shadow:2px 2px 0 #6b5a24}

/* ===== Barre d'onglets du bas (mobile) ===== */
.barre-bas{display:none}

/* ===== Mobile / tablette : modules empilés et repliables ===== */
@media(max-width:61.99rem){
  :root{--barre-bas:calc(3.9rem + env(safe-area-inset-bottom,0px))}

  .page,.col-main,.col-side,.duo{display:flex;flex-direction:column;align-items:stretch;gap:1.3rem}

  /* Quizz du jour : modes en carrousel horizontal */
  .quizz-cartes{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:.6rem;padding-bottom:.5rem}
  .quizz-carte{flex:0 0 min(78%,15rem);grid-template-columns:1fr;scroll-snap-align:start;gap:.4rem}

    padding-bottom:env(safe-area-inset-bottom,0px);background:var(--encre);border-top:3px solid var(--ocre)}

    color:var(--creme);text-decoration:none;font:600 .74rem var(--cond);letter-spacing:.06em;text-transform:uppercase}
  .barre-bas svg{width:1.3rem;height:1.3rem}

}
@media(max-width:34rem){

}

#minijeux{display:none!important}
@media(max-width:61.99rem){ .barre-bas{grid-template-columns:repeat(6,1fr)} .barre-bas a{font-size:.68rem;letter-spacing:.03em} }   /* lien « Jeux » vers mini-jeux.html */   /* retours 2026-10-24 : plus de bloc Mini-jeux sur l'accueil (le code reste : mode Test, onglet admin) */

.tw-chaine{display:flex;align-items:center;justify-content:space-between;gap:.4rem;flex-wrap:wrap}

<style>/* ===== PAGES mini-jeux.html et boutique.html (le style NieR de base vient du gabarit de l'accueil) ===== */
body{padding-bottom:0}
.pg-haut{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--encre);background:rgba(205,198,174,.94)}
[data-theme="sombre"] .pg-haut{background:rgba(41,37,29,.95)}
.pg-haut .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.55rem 0}
.pg-haut h1{margin:0;font:700 clamp(1.2rem,3.4vw,1.8rem)/1 var(--cond);letter-spacing:.14em;text-transform:uppercase}
.pg-nav{display:flex;flex-wrap:wrap;gap:.3rem;margin:0;padding:0;list-style:none}
.pg-nav a{display:block;padding:.3rem .65rem;border:1px solid var(--encre);background:var(--papier);text-decoration:none;font:600 .82rem var(--cond);letter-spacing:.1em;text-transform:uppercase}
.pg-nav a[aria-current="page"]{background:var(--ocre);color:#2a2619}
.pg-joueur{display:flex;align-items:center;gap:.5rem;margin-left:auto;font:600 .95rem var(--cond)}
.pg-joueur .avatar{width:2rem;height:2rem}
.pg-main{display:grid;gap:1.2rem;padding:1.2rem 0 2rem}
.pg-deux{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
.pg-main .chip{margin-top:10px}
.pg-intro{margin:.2rem 0 1rem;color:var(--encre2)}
/* placeholders dessinés en code : silhouette, couleur de rareté, « ? » */
.ph{position:relative;display:inline-grid;place-items:center;flex:none;overflow:hidden;border:1px solid var(--encre);background:var(--papier);color:var(--encre2)}
.ph i{position:absolute;inset:18% 22% 0;background:radial-gradient(circle at 50% 22%,var(--encre2) 0 17%,transparent 18%),radial-gradient(ellipse at 50% 100%,var(--encre2) 0 46%,transparent 47%);opacity:.35}
.ph-badge{border-radius:50%}
.ph-badge i{inset:14%;border-radius:50%;background:radial-gradient(circle,transparent 48%,var(--encre2) 50% 62%,transparent 64%)}
.ph b{position:relative;font:700 1.6em var(--cond);color:var(--encre)}
.ph-rare{box-shadow:inset 0 0 0 3px #6f8fb3}.ph-epique{box-shadow:inset 0 0 0 3px #9a6fb3}.ph-legendaire{box-shadow:inset 0 0 0 3px var(--ocre)}
/* boutique */
.bq-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.7rem}
.bq-carte{position:relative;display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:.7rem .5rem;border:1px solid var(--encre);background:var(--papier);cursor:pointer;font:inherit;color:inherit;text-align:center}
.bq-carte:hover,.bq-carte:focus-visible,.bq-carte.choisi{background:var(--ocre);color:#2a2619}
.bq-carte b{font:600 .95rem/1.15 var(--cond);letter-spacing:.04em;overflow-wrap:anywhere}
.bq-carte small{font:400 .78rem var(--mono)}
.bq-carte .cp-tag{position:absolute;top:.3rem;right:.3rem}
.bq-fiche{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:start;margin-top:1rem;padding:1rem;border:2px solid var(--encre);background:var(--papier)}
.cp-zone-cible{transition:background .3s}
.brille{animation:brille 1.1s ease-out}
@keyframes brille{0%{box-shadow:0 0 0 0 rgba(230,195,92,.0)}25%{box-shadow:0 0 0 6px rgba(230,195,92,.9),0 0 28px 8px rgba(230,195,92,.75)}100%{box-shadow:0 0 0 0 rgba(230,195,92,0)}}
.vol{position:fixed;z-index:200;pointer-events:none;filter:drop-shadow(0 0 10px rgba(230,195,92,.9))}
.etincelle{position:fixed;z-index:201;width:8px;height:8px;pointer-events:none;background:var(--ocre);transform:rotate(45deg);box-shadow:0 0 8px var(--ocre)}
/* mini-jeux */
.mj-grand{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:.8rem}
.mj-fiche{display:flex;flex-direction:column;gap:.4rem;padding:.9rem;border:1px solid var(--encre);background:var(--papier)}
.mj-fiche h3{margin:0;font:700 1.15rem var(--cond);letter-spacing:.08em;text-transform:uppercase}
.mj-fiche ul{margin:.2rem 0 .4rem;padding-left:1.1rem;font-size:.92rem}
.mj-fiche .cp-actions{margin-top:auto}
#mjScene .mj-image img{max-height:26rem}
#mjScene .mj-choix button{padding:.8rem .8rem;font-size:1.08rem}
@media(max-width:61.99rem){ .pg-deux{grid-template-columns:1fr} .pg-joueur{margin-left:0;width:100%} .pg-haut{position:static} }   /* mobile : le bandeau ne masque pas le jeu */
@media(max-width:34rem){ .bq-grille{grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr))} .bq-fiche{grid-template-columns:1fr} }
@media(prefers-reduced-motion:reduce){ .brille{animation:none;outline:3px solid var(--ocre)} }
/* Chocobo PMU */
.choco-multi-haut{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;justify-content:space-between;padding:.45rem .7rem;margin:.4rem 0 .6rem;background:var(--papier,#e6e1ce);border:1px solid var(--encre);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.choco-avert{border-left:4px solid var(--ocre);margin:.6rem 0}
.choco-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.2rem,1fr));gap:.55rem;margin:.6rem 0}
.choco-carte[disabled]{cursor:default;opacity:.85}
.choco-ico{display:grid;place-items:center;width:56px;height:56px;border:1px solid var(--encre)}
.choco-mise{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin:.5rem 0}
.choco-mise .actif{background:var(--ocre);color:#2a2619}
.choco-mise input{width:6.5rem}
.choco-piste{position:relative;margin:.6rem 0;border:2px solid var(--encre);background:var(--papier)}
.choco-piste canvas{display:block;width:100%}
.choco-direct{position:absolute;top:.5rem;right:.5rem;width:11.5rem;padding:.4rem;border:1px solid var(--encre);background:var(--creme);font:400 .78rem var(--mono)}
.choco-direct ol{margin:.2rem 0 0;padding:0;list-style:none}
.choco-direct li{display:flex;align-items:center;gap:.3rem;padding:.08rem 0}.choco-direct li img{width:16px;height:16px}.choco-direct li small{margin-left:auto}
.choco-direct li.moi,.choco-final li.moi{background:var(--ocre);color:#2a2619}
.choco-depart{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(3rem,10vw,6rem) var(--cond);color:var(--encre);background:rgba(230,225,206,.7)}
[data-theme="sombre"] .choco-depart{background:rgba(29,26,20,.7)}
.choco-podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:.5rem;align-items:end;margin:.6rem 0}
.choco-podium>div{display:flex;flex-direction:column;align-items:center;padding:.5rem;border:1px solid var(--encre);background:var(--papier);text-align:center}
.choco-podium .p1{border-width:2px;background:var(--ocre);color:#2a2619;padding:.8rem .5rem}
.choco-podium img{width:48px;height:48px}
.choco-final{columns:2;font:400 .85rem var(--mono)}
.choco-fiche{display:flex;flex-direction:column;align-items:center;gap:.05rem;font:400 .74rem/1.25 var(--mono)}
.choco-fiche span:first-child{color:#9a7414;font-size:.95rem;letter-spacing:.05em}[data-theme="sombre"] .choco-fiche span:first-child{color:var(--ocre)}.choco-fiche em{font-style:normal;font-weight:600}
.choco-humeur{margin:.2rem 0;font:600 1rem var(--cond);letter-spacing:.04em;color:var(--ocre2)}
.choco-confetti{position:fixed;top:0;z-index:300;width:8px;height:12px;pointer-events:none}
@media(max-width:34rem){ .choco-direct{position:static;width:auto;border-width:1px 0 0} .choco-grille{grid-template-columns:repeat(auto-fill,minmax(6.6rem,1fr))} }
.qz-bonus{margin:.2rem 0 .6rem;font-weight:700}
</style>
</head>

<script>/* =====================================================================
   OUTILS COMMUNS DES PAGES mini-jeux.html et boutique.html
   (intégrés à la construction par build_pages.py ; l'adresse et la clé
   PUBLIQUE de Supabase sont lues dans le gabarit de l'accueil)
   ===================================================================== */
const CONFIG = { supabaseUrl: "https://zdnvvokecziiwdcrmzwv.supabase.co", supabaseKey: "sb_publishable_dDmIBev0F6b6g_VRq7_5iA_eEZNUe3g", domaineAdmin: "@chapeauoptique.fr" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nb = n => Number(n || 0).toLocaleString("fr-FR");
function stocker(cle, val) { try { if (val === null) localStorage.removeItem(cle); else localStorage.setItem(cle, val); } catch { } }
function lireStock(cle) { try { return localStorage.getItem(cle) || ""; } catch { return ""; } }
function qzToken() { return lireStock("qzToken"); }
function qzPseudoLocal() { return lireStock("qzPseudo"); }
// session admin : même onglet que l'accueil (sessionStorage suit les liens)
let jeton = (() => { try { return sessionStorage.getItem("jeton"); } catch { return null; } })();
const sb = (chemin, opts = {}) => fetch(CONFIG.supabaseUrl + chemin, { ...opts, headers: { apikey: CONFIG.supabaseKey,
  ...(jeton ? { Authorization: "Bearer " + jeton } : {}), "Content-Type": "application/json", ...opts.headers } });
async function qzRpc(nom, corps) {
  const r = await fetch(CONFIG.supabaseUrl + "/rest/v1/rpc/" + nom, { method: "POST",
    headers: { apikey: CONFIG.supabaseKey, "Content-Type": "application/json" }, body: JSON.stringify(corps || {}) });
  let d = null; try { d = await r.json(); } catch { }
  if (!r.ok) { const e = new Error((d && d.message) || "http_" + r.status); e.code = d && d.code; e.status = r.status; throw e; }
  return d;
}
// admin connecté : l'appel porte aussi son jeton (mode Test, script 31) ; le serveur décide
async function rpcJoueur(nom, corps) {
  if (jeton) {
    const r = await sb("/rest/v1/rpc/" + nom, { method: "POST", body: JSON.stringify(corps || {}) });
    if (r.status !== 401 && r.status !== 403) {
      let d = null; try { d = await r.json(); } catch { }
      if (!r.ok) { const e = new Error((d && d.message) || "http_" + r.status); e.code = d && d.code; e.status = r.status; throw e; }
      return d;
    }
    jeton = null; try { sessionStorage.removeItem("jeton"); } catch { }
  }
  return qzRpc(nom, corps);
}
function gilIcone() { const t = document.getElementById("tplGil"); return t ? t.innerHTML.trim() : "Gils"; }

// Images : seulement le bucket « medias » du projet ou /medias/ ; sinon placeholder dessiné en code
const RX_IMG = /^(https:\/\/[a-z0-9]+\.supabase\.co\/storage\/v1\/object\/public\/medias\/|\/?medias\/)[a-z0-9_\/.-]+\.(webp|png|gif|jpe?g)$/i;
const imgOk = u => typeof u === "string" && RX_IMG.test(u);
const RARETE = { commun: "Commun", rare: "Rare", epique: "Épique", legendaire: "Légendaire" };
function visuel(a, taille, cls = "") {
  if (a && imgOk(a.fichier)) return `<img class="pf-img${a.pixel !== false ? " pixel" : ""} ${cls}" src="${esc(a.fichier)}" alt="${esc(a.nom || "")}" width="${taille}" height="${taille}" loading="lazy">`;
  const r = (a && a.rarete) || "commun", t = (a && a.type) === "badge" ? "badge" : "avatar";
  return `<span class="ph ph-${t} ph-${r} ${cls}" style="width:${taille}px;height:${taille}px" role="img" aria-label="${esc((a && a.nom) || "Image à venir")}"><i></i><b>?</b></span>`;
}

// Thème clair / sombre (même clé que l'accueil)
(function () {
  const b = $("themeBtn"); if (!b) return;
  const poser = s => { if (s) document.documentElement.dataset.theme = "sombre"; else delete document.documentElement.dataset.theme;
    b.textContent = s ? "◐ Clair" : "◐ Sombre"; b.setAttribute("aria-pressed", String(s)); };
  poser(document.documentElement.dataset.theme === "sombre");
  b.onclick = () => { const s = document.documentElement.dataset.theme !== "sombre"; poser(s); stocker("theme", s ? "sombre" : null); };
})();

// Bandeau joueur : avatar (ou initiale), pseudo, Gils ; vérifie la session comme l'accueil
const JOUEUR = { pseudo: "", profil: null, valide: false };
async function chargerJoueur() {
  const t = qzToken(); JOUEUR.valide = false; JOUEUR.profil = null;
  if (t) {
    try { const p = await qzRpc("quizz_pseudo_de", { p_token: t }); if (p === null) { stocker("qzToken", null); stocker("qzPseudo", null); } else { JOUEUR.valide = true; JOUEUR.pseudo = p || qzPseudoLocal(); } }
    catch { JOUEUR.valide = true; JOUEUR.pseudo = qzPseudoLocal(); }
    if (JOUEUR.valide) { try { JOUEUR.profil = await rpcJoueur("profil_moi", { p_token: qzToken() }); } catch { } }
  }
  dessinerJoueur();
}
// badges équipés (5 au plus, 16 px), à côté du pseudo
const badgesEquipes = p => { const l = p && Array.isArray(p.badges) ? p.badges.slice(0, 5).map(id => (p.inventaire || []).find(a => a.id === id)).filter(b => b && imgOk(b.fichier)) : [];
  return l.length ? ` <span class="pf-badges" id="pgBadges">${l.map(b => visuel(b, 16)).join("")}</span>` : ""; };
function dessinerJoueur() {
  const z = $("pgJoueur"); if (!z) return;
  if (!JOUEUR.valide) { z.innerHTML = `<span class="avatar">?</span><span>Invité · <a href="index.html#quizz">se connecter</a></span>`; return; }
  const p = JOUEUR.profil, av = p && (p.inventaire || []).find(a => a.id === p.avatar);
  z.innerHTML = `<span class="avatar${av && imgOk(av.fichier) ? " a-img" : ""}">${av && imgOk(av.fichier) ? visuel(av, 32) : esc((JOUEUR.pseudo || "?").charAt(0).toUpperCase())}</span>
    <span><b>${esc(JOUEUR.pseudo)}</b>${badgesEquipes(p)}${p ? ` · <span id="pgGils">${nb(p.gils)} ${gilIcone()}</span>` : ""}</span>`;
}

/* Visites sans cookie (script 40) : page mini-jeux ou boutique ; l'admin connecté n'est pas compté */
(function compterVisite() {
  const page = /boutique/.test(location.pathname) ? "boutique" : /mini-jeux/.test(location.pathname) ? "mini-jeux" : null;
  if (!page || (typeof jeton === "string" && jeton)) return;
  let nouveau = true; const k = "coVisite:" + page, j = new Date().toISOString().slice(0, 10);
  try { nouveau = localStorage.getItem(k) !== j; localStorage.setItem(k, j); } catch { }
  qzRpc("site_visite", { p_page: page, p_nouveau: nouveau }).catch(() => { });
})();
/* =====================================================================
   PAGE BOUTIQUE + COMPENDIUM (boutique.html)
   Tout est vérifié par le serveur (solde, possession, module ouvert,
   placeholders jamais vendus au public). À l'achat, l'objet glisse vers
   le Compendium, avec un petit son (Web Audio) et un effet brillant.
   ===================================================================== */
(() => {
  const B = { ouvert: false, test: false, catalogue: null, rayon: "avatars", fiche: null, confirmer: false, onglet: "collection", choixAv: undefined, choixBd: null };
  const ERR = { session_invalide: "Session expirée : reconnecte-toi sur l'accueil.", boutique_fermee: "La boutique est fermée pour l'instant.",
    solde_insuffisant: "Pas assez de Gils pour cet article.", deja_possede: "Tu possèdes déjà cet article.", article_indisponible: "Cet article n'est plus en vente.",
    onglet_bientot: "Ce rayon ouvre bientôt.", trop_de_badges: "5 badges au maximum.", avatar_non_possede: "Cet avatar ne t'appartient pas.", badge_non_possede: "Un des badges ne t'appartient pas." };
  const msgErr = e => ERR[Object.keys(ERR).find(k => String(e && e.message).includes(k))] || "Erreur : " + (e && e.message || e);
  const zB = $("bqCorps"), zC = $("cpCorps");
  const message = (t, err) => { const m = $("bqMsg"); if (m) { m.textContent = t; m.classList.toggle("err", !!err); } };
  const inventaire = () => (JOUEUR.profil && JOUEUR.profil.inventaire) || [];
  const article = id => inventaire().find(a => a.id === id);

  async function demarrer() {
    let m = null; try { m = await rpcJoueur("site_modules_etat", {}); } catch { }
    B.ouvert = !!(m && m.boutique === true); B.test = !!(m && Array.isArray(m._test) && m._test.includes("boutique"));
    $("bqTest").hidden = !B.test;
    if (!B.ouvert) {
      $("pgContenu").innerHTML = `<section class="chip"><div class="chip-corps"><div class="cp-vide"><b>Boutique fermée</b>Elle ouvrira bientôt. <a href="index.html">Retour à l'accueil</a></div></div></section>`;
      return;
    }
    await chargerJoueur(); await chargerCatalogue(); await chargerOption();
    if (location.hash === "#compendium") { B.onglet = "collection"; $("compendium").scrollIntoView(); }
    dessinerBoutique(); dessinerCompendium();
  }
  async function chargerCatalogue() {
    try { B.catalogue = await rpcJoueur("boutique_catalogue", { p_token: JOUEUR.valide ? qzToken() : null }); }
    catch (e) { B.catalogue = { erreur: msgErr(e), articles: [] }; }
  }

  // option Invitation du Chocobo PMU (script 39) : affichée si le jeu est ouvert à ce joueur
  async function chargerOption() {
    B.opt = null; if (!JOUEUR.valide) return;
    try { B.opt = await rpcJoueur("chocobo_multi_liste", { p_token: qzToken() }); } catch { B.opt = null; }
  }
  function blocOption() {
    const o = B.opt; if (!o) return "";
    const act = o.option_invitation ? `<b>Débloquée</b>` : B.confOpt ? `<span>Acheter pour <b>${nb(o.prix_invitation)} ${gilIcone()}</b> ?</span> <button class="bouton" type="button" data-act="opt-confirmer">Confirmer</button> <button class="mini" type="button" data-act="opt-annuler">Annuler</button>`
      : `<button class="bouton" type="button" data-act="opt-acheter">Acheter pour ${nb(o.prix_invitation)} ${gilIcone()}</button>`;
    return `<div class="note et-ligne" id="bqOption" style="margin-top:1rem"><div><b>Option « Invitation » · Chocobo PMU</b><br><small>Achat permanent : publie une invitation à ta session multijoueur dans le panneau Quizz du jour (une à la fois, texte fixe).</small></div><span>${act}</span></div>`;
  }

  /* ---------- Boutique ---------- */
  const RAYONS = [["avatars", "Avatars"], ["badges", "Badges"], ["twitch", "Twitch"], ["youtube", "YouTube"]];
  function dessinerBoutique() {
    const c = B.catalogue || {}, arts = (c.articles || []).filter(a => a.onglet === B.rayon);
    let h = `<div class="cp-sous" role="tablist" aria-label="Rayons">${RAYONS.map(([k, n]) => `<button type="button" role="tab" data-rayon="${k}" aria-selected="${k === B.rayon}"${["avatars", "badges"].includes(k) ? "" : ` aria-disabled="true" title="Bientôt"`}>${n}</button>`).join("")}</div>`;
    if (c.erreur) h += `<p class="cp-msg err">${esc(c.erreur)}</p>`;
    else if (!arts.length) h += `<div class="cp-vide"><b>Rayon vide</b>Les articles arrivent bientôt.</div>`;
    else h += `<div class="bq-grille">${arts.map(a => `<button type="button" class="bq-carte${a.id === B.fiche ? " choisi" : ""}" data-fiche="${esc(a.id)}">
        <span class="cp-tag">${a.possede ? "possédé" : a.gratuit ? "offert" : nb(a.prix) + " " + gilIcone()}</span>${visuel(a, 96)}<b>${esc(a.nom)}</b><small>${esc(RARETE[a.rarete] || "")}${a.placeholder ? " · test" : ""}</small></button>`).join("")}</div>`;
    const f = B.fiche && (c.articles || []).find(a => a.id === B.fiche);
    if (f) {
      const solde = JOUEUR.profil ? Number(JOUEUR.profil.gils || 0) : null;
      let act;
      if (f.possede) act = `<p><b>Déjà dans ton Compendium.</b> <button class="mini" type="button" data-act="profil">L'équiper</button></p>`;
      else if (!f.achetable) act = `<p>Ce rayon ouvre bientôt.</p>`;
      else if (!JOUEUR.valide) act = `<a class="bouton" href="index.html#quizz">Se connecter pour acheter</a>`;
      else if (B.confirmer) act = `<p>Acheter <b>${esc(f.nom)}</b> pour <b>${nb(f.prix)} ${gilIcone()}</b> ? Ton solde passera de ${nb(solde)} ${gilIcone()} à ${nb(solde - f.prix)} ${gilIcone()}.</p>
          <div class="cp-actions"><button class="bouton" type="button" data-act="confirmer">Confirmer l'achat</button><button class="mini" type="button" data-act="annuler">Annuler</button></div>`;
      else act = `<button class="bouton" type="button" data-act="acheter">Acheter pour ${nb(f.prix)} ${gilIcone()}</button>`;
      h += `<div class="bq-fiche" id="bqFiche"><span id="bqVisuel">${visuel(f, 128)}</span><div><h3 style="margin:0">${esc(f.nom)}</h3><p class="qz-petit">${esc(RARETE[f.rarete] || "")} · ${f.gratuit ? "offert" : nb(f.prix) + " " + gilIcone()}</p>${f.description ? `<p>${esc(f.description)}</p>` : ""}${f.placeholder ? `<p class="qz-petit">Article de test (image à venir) : invisible pour le public.</p>` : ""}${act}</div></div>`;
    }
    h += blocOption() + `<p class="cp-msg" id="bqMsg" role="status"></p><p class="qz-petit">Décoration uniquement : aucun avantage en jeu. Les Gils ne s'achètent pas avec de l'argent réel.</p>`;
    zB.innerHTML = h;
  }

  /* ---------- Compendium ---------- */
  function dessinerCompendium() {
    document.querySelectorAll("#compendium [data-cp]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.cp === B.onglet)));
    if (!JOUEUR.valide || !JOUEUR.profil) { zC.innerHTML = `<div class="cp-vide"><b>Ta collection t'attend</b>Connecte-toi sur l'accueil (panneau Quizz) : tes avatars, badges et Gils sont liés à ton compte.<div class="cp-actions" style="justify-content:center"><a class="bouton" href="index.html#quizz">Se connecter</a></div></div>`; return; }
    const inv = inventaire(), av = inv.filter(a => a.type === "avatar"), bd = inv.filter(a => a.type === "badge");
    if (B.onglet === "collection") {
      zC.innerHTML = !inv.length ? `<div class="cp-vide cp-zone-cible" id="cpCible"><b>Ta collection est vide</b>Choisis un avatar ou un badge dans la boutique.</div>`
        : `<div class="cp-zone-cible" id="cpCible"><p class="qz-sous">Avatars (${av.length})</p><div class="cp-grille">${av.map(a => `<div class="cp-carte" data-id="${esc(a.id)}">${visuel(a, 64)}<b>${esc(a.nom)}</b><small>${esc(RARETE[a.rarete] || "")}</small></div>`).join("") || "<p class='qz-petit'>Aucun.</p>"}</div>
           <p class="qz-sous" style="margin-top:1rem">Badges (${bd.length})</p><div class="cp-grille">${bd.map(a => `<div class="cp-carte" data-id="${esc(a.id)}">${visuel(a, 64)}<b>${esc(a.nom)}</b><small>${esc(RARETE[a.rarete] || "")}</small></div>`).join("") || "<p class='qz-petit'>Aucun.</p>"}</div>
           <p class="qz-petit" style="margin-top:.8rem">Poissons et cartes : bientôt.</p></div>`;
    } else if (B.onglet === "profil") {
      if (B.choixAv === undefined) B.choixAv = JOUEUR.profil.avatar || null;
      if (!B.choixBd) B.choixBd = (JOUEUR.profil.badges || []).slice(0, 5);
      const a = article(B.choixAv);
      zC.innerHTML = `<div class="cp-carte-profil cp-zone-cible" id="cpCible"><div class="cp-rangee">${B.choixBd.map(id => article(id)).filter(Boolean).map(b => visuel(b, 32)).join("")}</div>
          <div class="cp-grand">${a ? visuel(a, 96) : esc((JOUEUR.pseudo || "?").charAt(0).toUpperCase())}</div><strong>${esc(JOUEUR.pseudo)}</strong></div>
        <p class="qz-sous" style="margin-top:1rem">Avatar</p><div class="cp-grille"><button type="button" class="cp-carte${B.choixAv ? "" : " choisi"}" data-av=""><span class="ph" style="width:64px;height:64px"><b>${esc((JOUEUR.pseudo || "?").charAt(0).toUpperCase())}</b></span><b>Initiale</b></button>
          ${av.map(x => `<button type="button" class="cp-carte${x.id === B.choixAv ? " choisi" : ""}" data-av="${esc(x.id)}" aria-pressed="${x.id === B.choixAv}">${visuel(x, 64)}<b>${esc(x.nom)}</b></button>`).join("")}</div>
        <p class="qz-sous" style="margin-top:1rem">Badges affichés (${B.choixBd.length} / 5)</p>
        <div class="cp-grille">${bd.map(x => `<button type="button" class="cp-carte${B.choixBd.includes(x.id) ? " choisi" : ""}" data-bd="${esc(x.id)}" aria-pressed="${B.choixBd.includes(x.id)}">${visuel(x, 64)}<b>${esc(x.nom)}</b></button>`).join("") || "<p class='qz-petit'>Aucun badge pour l'instant.</p>"}</div>
        <div class="cp-actions"><button class="bouton" type="button" data-act="enregistrer">Enregistrer mon profil</button></div><p class="cp-msg" id="cpMsg" role="status"></p>`;
    } else {
      const j = JOUEUR.profil.journal || [];
      zC.innerHTML = `<div class="cp-zone-cible" id="cpCible"><p class="qz-sous">Derniers mouvements de Gils</p>${j.length ? `<ul class="cp-journal">${j.map(l => `<li><span>${esc(new Date(l.quand).toLocaleDateString("fr-FR"))} · ${esc(String(l.motif || "").replace(/^achat:/, "achat : ").replace(/^jeu:/, "jeu : ").replace(/^depart:.*/, "Gils de départ"))}</span><b>${l.variation > 0 ? "+" : ""}${nb(l.variation)} ${gilIcone()}</b></li>`).join("")}</ul>` : "<p class='qz-petit'>Aucun mouvement pour l'instant.</p>"}</div>`;
    }
  }

  /* ---------- Son et animation d'achat ---------- */
  function son() {
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      const ctx = new C(), t0 = ctx.currentTime, maitre = ctx.createGain(); maitre.gain.value = .18; maitre.connect(ctx.destination);
      [[784, 0], [1047, .09], [1319, .18]].forEach(([f, d]) => {        // petit arpège « cristal »
        const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "triangle"; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(1, t0 + d + .015); g.gain.exponentialRampToValueAtTime(.001, t0 + d + .45);
        o.connect(g); g.connect(maitre); o.start(t0 + d); o.stop(t0 + d + .5);
      });
      setTimeout(() => ctx.close(), 1200);
    } catch { }
  }
  async function envol(source) {
    const cible = $("cpCible") || $("compendium");
    const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
    son();
    if (source && !reduit && cible) {
      const a = source.getBoundingClientRect(), b = cible.getBoundingClientRect();
      const v = source.cloneNode(true); v.classList.add("vol"); v.removeAttribute("id");
      Object.assign(v.style, { left: a.left + "px", top: a.top + "px", width: a.width + "px", height: a.height + "px", margin: 0 });
      document.body.append(v);
      const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + Math.min(b.height, 160) / 2 - (a.top + a.height / 2);
      const anim = v.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${dx * .55}px,${dy * .55 - 60}px) scale(.85) rotate(-8deg)`, opacity: 1, offset: .55 },
        { transform: `translate(${dx}px,${dy}px) scale(.35)`, opacity: .2 }], { duration: 850, easing: "cubic-bezier(.45,.05,.3,1)" });
      for (let k = 0; k < 8; k++) {   // étincelles au départ
        const s = document.createElement("span"); s.className = "etincelle"; s.style.left = a.left + a.width / 2 + "px"; s.style.top = a.top + a.height / 2 + "px"; document.body.append(s);
        const ang = k / 8 * Math.PI * 2; s.animate([{ transform: "translate(0,0) rotate(45deg) scale(1)", opacity: 1 }, { transform: `translate(${Math.cos(ang) * 60}px,${Math.sin(ang) * 60}px) rotate(45deg) scale(.2)`, opacity: 0 }], { duration: 600, easing: "ease-out" }).onfinish = () => s.remove();
      }
      await anim.finished.catch(() => { }); v.remove();
    }
    const c2 = $("cpCible") || $("compendium");
    if (c2) { c2.classList.remove("brille"); void c2.offsetWidth; c2.classList.add("brille"); setTimeout(() => c2.classList.remove("brille"), 1200); }
  }

  /* ---------- Actions ---------- */
  zB.addEventListener("click", async e => {
    const t = e.target.closest("button"); if (!t || t.disabled) return;
    if (t.dataset.rayon) { if (t.getAttribute("aria-disabled") === "true") return; B.rayon = t.dataset.rayon; B.fiche = null; B.confirmer = false; return dessinerBoutique(); }
    if (t.dataset.fiche) { B.fiche = t.dataset.fiche; B.confirmer = false; dessinerBoutique(); const f = $("bqFiche"); if (f) f.scrollIntoView({ block: "nearest" }); return; }
    const a = t.dataset.act;
    if (a === "acheter") { B.confirmer = true; return dessinerBoutique(); }
    if (a === "opt-acheter" || a === "opt-annuler") { B.confOpt = a === "opt-acheter"; return dessinerBoutique(); }
    if (a === "opt-confirmer") {
      t.disabled = true; B.confOpt = false;
      try { await rpcJoueur("chocobo_option_acheter", { p_token: qzToken(), p_option: "invitation" }); await chargerJoueur(); await chargerOption(); son(); dessinerBoutique(); message("Option Invitation débloquée : utilise-la dans Chocobo PMU > Multijoueur."); }
      catch (err) { dessinerBoutique(); message(msgErr(err), true); }
      return;
    }
    if (a === "annuler") { B.confirmer = false; return dessinerBoutique(); }
    if (a === "profil") { B.onglet = "profil"; dessinerCompendium(); $("compendium").scrollIntoView({ block: "start" }); return; }
    if (a === "confirmer") {
      t.disabled = true;
      try {
        const r = await rpcJoueur("boutique_acheter", { p_token: qzToken(), p_article: B.fiche });
        const visuelSource = $("bqVisuel");
        B.onglet = "collection"; B.confirmer = false;
        await chargerJoueur(); await chargerCatalogue(); dessinerCompendium();
        await envol(visuelSource && visuelSource.firstElementChild);
        dessinerBoutique(); message(`Acheté ! ${r && r.article ? r.article.nom : "L'article"} est dans ton Compendium.`);
      } catch (err) { B.confirmer = false; dessinerBoutique(); message(msgErr(err), true); }
    }
  });
  document.querySelectorAll("#compendium [data-cp]").forEach(b => b.addEventListener("click", () => { B.onglet = b.dataset.cp; B.choixAv = undefined; B.choixBd = null; dessinerCompendium(); }));
  zC.addEventListener("click", async e => {
    const t = e.target.closest("button"); if (!t || t.disabled) return;
    if (t.dataset.av !== undefined) { B.choixAv = t.dataset.av || null; return dessinerCompendium(); }
    if (t.dataset.bd) { const i = B.choixBd.indexOf(t.dataset.bd); if (i >= 0) B.choixBd.splice(i, 1); else if (B.choixBd.length < 5) B.choixBd.push(t.dataset.bd); return dessinerCompendium(); }
    if (t.dataset.act === "enregistrer") {
      t.disabled = true;
      try { await rpcJoueur("profil_equiper", { p_token: qzToken(), p_avatar: B.choixAv || null, p_badges: B.choixBd }); await chargerJoueur(); B.choixAv = undefined; B.choixBd = null; dessinerCompendium(); const m = $("cpMsg"); if (m) m.textContent = "Profil enregistré : il apparaît dans le classement."; }
      catch (err) { t.disabled = false; const m = $("cpMsg"); if (m) { m.textContent = msgErr(err); m.classList.add("err"); } }
    }
  });
  demarrer();
})();
</script>
</body>
