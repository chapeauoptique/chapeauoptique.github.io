name: Mise à jour des vidéos
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire les flux YouTube
        run: |
          python3 - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          ns = {"a": "http://www.w3.org/2005/Atom", "y": "http://www.youtube.com/xml/schemas/2015"}
          feeds = {"videos": "UCqPoM6CUwhIt1NbO75QFM5Q", "vods": "UC2WWBJPfVOEMSes0KfFwAAg"}
          data = {}
          for name, cid in feeds.items():
              url = "https://www.youtube.com/feeds/videos.xml?channel_id=" + cid
              root = ET.fromstring(urllib.request.urlopen(url, timeout=30).read())
              data[name] = [{"id": e.find("y:videoId", ns).text, "title": e.find("a:title", ns).text, "date": e.find("a:published", ns).text} for e in root.findall("a:entry", ns)]
          open("data/videos.js", "w", encoding="utf-8").write("window.CO_DATA=" + json.dumps(data, ensure_ascii=False) + ";\n")
          PY
      - name: Enregistrer si changement
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Mise à jour des vidéos" && git push)
